# Reusable deploy job. The `environment:` binding is what enforces the gate:
# configure Settings → Environments → stage/prod with required reviewers,
# wait timers and branch restrictions (main only). Each environment can hold
# its own AWS_CI_ROLE_ARN / EKS_CLUSTER_NAME variables (separate accounts).
name: deploy-eks

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_repo:
        type: string
        required: true
      image_digest:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: kubectl apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-gov-west-1' }}
      CLUSTER: ${{ vars.EKS_CLUSTER_NAME || format('mission-api-{0}', inputs.environment) }}
      IMAGE: ${{ inputs.image_repo }}@${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: gha-deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR (for signature verification)
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      - name: Verify signature before deploy (SI-7)
        run: |
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yml@refs/heads/main$" \
            > /dev/null
          echo "Signature verified for $IMAGE"
      - name: Render manifests pinned to the signed digest
        run: |
          kubectl kustomize "k8s/overlays/${{ inputs.environment }}" \
            | sed -E "s#image: [^ ]*/mission-api@sha256:0{64}#image: ${IMAGE}#" > /tmp/rendered.yaml
          grep -q "image: ${IMAGE}" /tmp/rendered.yaml || { echo "image substitution failed"; exit 1; }
          grep -n "image:" /tmp/rendered.yaml
      - name: Apply to EKS
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          kubectl apply --server-side -f /tmp/rendered.yaml
          kubectl -n mission-api rollout status deploy/mission-api --timeout=5m
      - name: Summary
        run: echo "Deployed \`$IMAGE\` to **${{ inputs.environment }}** ($CLUSTER)" >> "$GITHUB_STEP_SUMMARY"
