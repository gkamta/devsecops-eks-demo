apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-api
  namespace: mission-api
  labels:
    app.kubernetes.io/name: mission-api
    app.kubernetes.io/part-of: devsecops-eks-demo
  annotations:
    checkov.io/skip1: CKV_K8S_38=IRSA needs the projected service account token mounted
    checkov.io/skip2: CKV_K8S_43=Raw base uses a placeholder; kustomize/CI pins the image by sha256 digest
    checkov.io/skip3: CKV_K8S_14=Raw base uses a placeholder; kustomize/CI pins the image by sha256 digest
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mission-api
    spec:
      serviceAccountName: mission-api
      automountServiceAccountToken: true  # needed for the IRSA projected token
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mission-api
      containers:
        - name: api
          # Deployed by digest from CI (kustomize edit set image ...@sha256:...).
          image: mission-api
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mission-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
