[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["app/tests"]

[tool.coverage.run]
omit = ["app/tests/*"]
