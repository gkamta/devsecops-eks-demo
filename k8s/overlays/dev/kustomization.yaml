apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
    includeSelectors: false
patches:
  - target:
      kind: ConfigMap
      name: mission-api
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
      - op: replace
        path: /data/OIDC_ISSUER
        value: https://keycloak.dev.example.mil/realms/devsecops
  - target:
      kind: ServiceAccount
      name: mission-api
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws-us-gov:iam::123456789012:role/mission-api-dev-mission-api-irsa
  - target:
      kind: HorizontalPodAutoscaler
      name: mission-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
